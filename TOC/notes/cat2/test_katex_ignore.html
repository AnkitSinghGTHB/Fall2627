            ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
            ignoredClasses: ["katex-ignore"],
            throwOnError: false
        });
    });
</script>
</head>

<p id="t2">Test 2: Put `$` in $\text{FOLLOW}(S)$, where $S$ is the start symbol (`$` is the input endmarker).</p>
